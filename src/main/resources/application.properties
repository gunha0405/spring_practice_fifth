spring.application.name=spring_practice_fifth
# DATABASE
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=myappdb_kor;encrypt=false;trustServerCertificate=true
spring.datasource.username=appuser
spring.datasource.password=${MSSQL_SA_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true 
spring.jpa.properties.hibernate.show_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.root=INFO
logging.level.com.example=DEBUG


# Mail settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# social Login
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Quartz
spring.quartz.job-store-type=memory
spring.quartz.jdbc.initialize-schema=always

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
