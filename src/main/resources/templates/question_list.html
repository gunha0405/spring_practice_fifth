<html layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-3">
    <div class="container my-3">

        <!-- 검색 폼 -->
        <form th:action="@{/question/search}" method="get" class="mb-3">
            <div class="row g-2">
                <div class="col-auto">
                    <input type="text" name="subject" class="form-control" placeholder="제목 입력"
                           th:value="${subject}">
                </div>
                <div class="col-auto">
                    <input type="text" name="value" class="form-control"
                           th:value="${value}"
                           th:placeholder="${#authentication.principal.customerId == 'A' ? '키워드 입력' : '해시태그 입력'}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-primary">검색</button>
                </div>
            </div>
        </form>

        <!-- 질문 리스트 -->
        <table class="table">
            <thead class="table-dark">
            <tr class="text-center">
                <th>번호</th>
                <th style="width:50%">제목</th>
                <th>글쓴이</th>
                <th>작성일시</th>
            </tr>
            </thead>
            <tbody>
            <tr class="text-center" th:each="question, loop : ${paging}">
                <!-- 번호 -->
                <td th:text="${paging.totalElements - (paging.number * paging.size) - loop.index}"></td>

                <!-- 제목 -->
                <td class="text-start">
                    <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a>
                    <span class="text-danger small ms-2"
                          th:if="${answerCounts[question.id] > 0}"
                          th:text="${answerCounts[question.id]}"></span>
                </td>

                <!-- 글쓴이 -->
                <td><span th:if="${question.author != null}" th:text="${question.author.username}"></span></td>

                <!-- 작성일 -->
                <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            </tbody>
        </table>

        <!-- 페이징 처리 -->
        <ul class="pagination justify-content-center">
            <!-- 이전 -->
            <li class="page-item" th:classappend="${!paging.hasPrevious()} ? 'disabled'">
                <a class="page-link"
                   th:if="${searchMode}"
                   th:href="@{|/question/search?page=${paging.number-1}&subject=${subject}&value=${value}|}">
                    이전
                </a>
                <a class="page-link"
                   th:unless="${searchMode}"
                   th:href="@{|/question/list?page=${paging.number-1}|}">
                    이전
                </a>
            </li>

            <!-- 페이지 번호 -->
            <li th:each="page: ${#numbers.sequence(0, paging.totalPages-1)}"
                th:if="${page >= paging.number-5 and page <= paging.number+5}"
                th:classappend="${page == paging.number} ? 'active'"
                class="page-item">
                <a class="page-link"
                   th:if="${searchMode}"
                   th:href="@{|/question/search?page=${page}&subject=${subject}&value=${value}|}"
                   th:text="${page}"></a>
                <a class="page-link"
                   th:unless="${searchMode}"
                   th:href="@{|/question/list?page=${page}|}"
                   th:text="${page}"></a>
            </li>

            <!-- 다음 -->
            <li class="page-item" th:classappend="${!paging.hasNext()} ? 'disabled'">
                <a class="page-link"
                   th:if="${searchMode}"
                   th:href="@{|/question/search?page=${paging.number+1}&subject=${subject}&value=${value}|}">
                    다음
                </a>
                <a class="page-link"
                   th:unless="${searchMode}"
                   th:href="@{|/question/list?page=${paging.number+1}|}">
                    다음
                </a>
            </li>
        </ul>

        <a th:href="@{/question/create}" class="btn btn-primary">질문 등록하기</a>
    </div>
</div>
</html>
