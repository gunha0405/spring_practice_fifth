<html layout:decorate="~{layout}">
<div layout:fragment="content" class="container">
    <h5 class="my-3 border-bottom pb-2">질문등록</h5>
    <form th:object="${questionForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        
        <!-- 에러 표시 -->
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>

        <!-- 제목 -->
        <div class="mb-3">
            <label for="subject" class="form-label">제목</label>
            <input type="text" th:field="*{subject}" class="form-control">
        </div>

        <!-- 내용 -->
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" class="form-control" rows="10"></textarea>
        </div>

        <!-- keyword (A 고객사만) -->
        <div class="mb-3" th:if="${customerId == 'A'}">
            <label for="keyword" class="form-label">키워드</label>
            <input type="text" th:field="*{keyword}" class="form-control">
        </div>

        <!-- hashtag (B 고객사만) -->
        <div class="mb-3" th:if="${customerId == 'B'}">
            <label for="hashtag" class="form-label">해시태그</label>
            <input type="text" th:field="*{hashtag}" class="form-control">
        </div>

        <!-- 저장 버튼 -->
        <input type="submit" value="저장하기" class="btn btn-primary my-2">
    </form>
</div>
</html>
